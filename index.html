<body id="app">
    <header :class="{ dark: store.dark }">

        <div class="logo">
            <h2>The Fartical Demonlist</h2>
            <p>v1.2.7</p>
        </div>

        <nav class="nav">

            <router-link class="nav__tab" to="/">
                <span class="type-label-lg">List</span>
            </router-link>

            <router-link class="nav__tab" to="/leaderboard">
                <span class="type-label-lg">Leaderboard</span>
            </router-link>

            <router-link class="nav__tab" to="/roulette">
                <span class="type-label-lg">Roulette</span>
            </router-link>

            <router-link class="nav__tab" to="/changelog">
                <span class="type-label-lg">Changelog</span>
            </router-link>

            <div class="nav__spacer"></div>

            <button
                class="nav__icon"
                @click.prevent="store.toggleDark()"
                title="Toggle Dark Mode"
            >
                <img
                    :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                    alt="Dark Mode"
                />
            </button>

            <a
                class="nav__icon"
                href="https://discord.gg/j4GETs49R"
                target="_blank"
                title="Discord"
            >
                <img src="/assets/discord.svg" alt="Discord">
            </a>

            <a
                class="nav__cta type-label-lg"
                href="https://forms.gle/72bHZaYGMY7sW6tx7"
                target="_blank"
            >
                Submit Record
            </a>

        </nav>

    </header>

    <router-view v-slot="{ Component }">
        <transition name="page" mode="out-in">
            <component
                :is="Component"
                :class="{ dark: store.dark }"
            />
        </transition>
    </router-view>

</body>
